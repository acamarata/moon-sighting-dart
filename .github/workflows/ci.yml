name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Dart ${{ matrix.dart-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dart-version: [stable, beta]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.dart-version }}
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub publish --dry-run

  # ───────────────────────────────────────────────────────────────────────────
  # Hostile-timezone matrix.
  #
  # Bugs in this family hide behind a single-timezone suite. The sibling
  # TypeScript package shipped three of them while green, because every run
  # happened on a machine west of UTC. Each zone below catches something the
  # others cannot: UTC is the control, Kiritimati is UTC+14 and Etc/GMT+12 is
  # UTC-12 (the two extremes), Tokyo is east with no DST, New York is west with
  # DST, and Auckland exercises a southern-hemisphere transition.
  # ───────────────────────────────────────────────────────────────────────────
  timezones:
    name: Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - America/New_York
          - Asia/Tokyo
          - Pacific/Kiritimati
          - Etc/GMT+12
          - Pacific/Auckland
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Confirm the runner is actually in the matrix zone
        run: |
          echo "TZ=$TZ"
          date
      - run: dart test
